syntax = "proto3";

package metalstack.cli.v2;

import "buf/validate/validate.proto";
import "metalstack/api/v2/project.proto";

// ProjectMember defines a user that participates in a project.
message ProjectMember {
  // project is the project id to which the member belongs.
  string project = 1 [(buf.validate.field).string.uuid = true];
  // ProjectMember is the project member.
  metalstack.api.v2.ProjectMember project_member = 2;
}
