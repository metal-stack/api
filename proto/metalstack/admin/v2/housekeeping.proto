syntax = "proto3";

package metalstack.admin.v2;

import "buf/validate/validate.proto";
import "metalstack/api/v2/common.proto";

// HousekeepingService provides housekeeping operations.
service HousekeepingService {
  // Machine housekeeping
  rpc Machine(HousekeepingServiceMachineRequest) returns (HousekeepingServiceMachineResponse) {
    option (metalstack.api.v2.admin_roles) = ADMIN_ROLE_EDITOR;
    option (metalstack.api.v2.auditing) = AUDITING_INCLUDED;
  }
}

// HousekeepingServiceMachineRequest is the request payload for a machine housekeeping request.
message HousekeepingServiceMachineRequest {
  // Housekeeping Action to perform.
  MachineHousekeepingAction action = 1 [(buf.validate.field).enum.defined_only = true];
}

// HousekeepingServiceMachineResponse is the response payload for a machine housekeeping request.
message HousekeepingServiceMachineResponse {
  // Housekeeping Action which was performed.
  MachineHousekeepingAction action = 1;
  // Modified Machine IDs modified during this housekeeping action.
  repeated string modified_machine_ids = 2;
}

// HousekeepingAction defines which housekeeping action should be triggered.
enum MachineHousekeepingAction {
  // MACHINE_HOUSEKEEPING_ACTION_UNSPECIFIED is not defined.
  MACHINE_HOUSEKEEPING_ACTION_UNSPECIFIED = 0;
  // MACHINE_HOUSEKEEPING_ACTION_VPN_CONNECTED updates machines which have vpn configured if they are connected or not.
  MACHINE_HOUSEKEEPING_ACTION_VPN_CONNECTED = 1 [(metalstack.api.v2.enum_string_value) = "vpn-connected"];
  // MACHINE_HOUSEKEEPING_ACTION_LIVELINESS reports the liveliness of machines.
  MACHINE_HOUSEKEEPING_ACTION_LIVELINESS = 2 [(metalstack.api.v2.enum_string_value) = "liveliness"];
  // MACHINE_HOUSEKEEPING_ACTION_RESURRECT resurrect dead machines.
  MACHINE_HOUSEKEEPING_ACTION_RESURRECT = 3 [(metalstack.api.v2.enum_string_value) = "resurrect"];
}
